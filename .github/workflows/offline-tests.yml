name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LLM_PROVIDER_ORDER: ''
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GROQ_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Check whitespace
        run: git diff --check
      - name: Check committed whitespace
        run: git show --format= --check HEAD
      - name: Complete offline suite
        run: >-
          python -m pytest -q
          --ignore=tests/integration/test_openrouter.py
          --deselect=tests/test_browser_discovery.py::BrowserDiscoveryTests::test_selenium_disabled_input_visible_text_selector_matches_its_element
